# CI/CD for the course site.
#   check  : QA (HTML, links, math rendering) and drill tests, for pages marked "written"
#   build  : assemble _site/ with only finished pages (drafts in progress are never published)
#   deploy : publish _site/ to GitHub Pages from the default branch
# Deploy requires Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Until that is set, the deploy job is skipped and the old branch-based deployment continues.
name: site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: exercises/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest playwright
          python -m playwright install --with-deps chromium

      - name: QA finished pages
        run: python tools/qa.py --written-only -q

      - name: Drill tests for finished pages (reference solutions)
        run: |
          tests=$(python tools/build_site.py --list-tests)
          echo "$tests"
          python -m pytest $tests --solutions -q

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site (finished pages only)
        run: python3 tools/build_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Read Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "Pages build_type: $bt"
          echo "build_type=$bt" >> "$GITHUB_OUTPUT"
          if [ "$bt" != "workflow" ]; then
            echo "::notice::Pages source is not 'GitHub Actions' (build_type=$bt); skipping deploy. Set Settings -> Pages -> Source to GitHub Actions to enable it."
          fi

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
